# This is a Declarative Automation Bundle definition for semiconductor_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: semiconductor_pipeline
  uuid: d8a18a6b-35d5-4287-a661-4397068a8a74

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-6628f0d6-62dc.cloud.databricks.com
    variables:
      catalog: datasheet_project
      schema: bronze
  prod:
    mode: production
    workspace:
      host: https://dbc-6628f0d6-62dc.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/${workspace.current_user.userName} to make sure we only have a single copy.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: datasheet_project_prod   
      schema: bronze
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
